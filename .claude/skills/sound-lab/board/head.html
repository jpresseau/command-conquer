<title>Battlefield Sound Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field-radio console - one panel of channel strips per kind of sound, each strip a
   name, what it is, its waveform, and the two takes to compare. Dark-first: it is equipment. */
:root {
  --bg: #12161a; --panel: #1a2026; --line: #2b343c; --fg: #dfe5e8; --dim: #8b98a2;
  --new: #e8b04a; --old: #7c8a95; --wave: #e8b04a; --live: #6fd18a;
  --display: 'Chakra Petch', 'Arial Narrow', sans-serif;
  --body: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #e9ecee; --panel: #f7f8f9; --line: #cfd6db; --fg: #1b2228; --dim: #5b6872;
  --new: #a86a00; --old: #6b7883; --wave: #b87700; --live: #1f8a45; color-scheme: light } }
:root[data-theme="light"] {
  --bg: #e9ecee; --panel: #f7f8f9; --line: #cfd6db; --fg: #1b2228; --dim: #5b6872;
  --new: #a86a00; --old: #6b7883; --wave: #b87700; --live: #1f8a45; color-scheme: light }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; display: grid; gap: 28px; }
header { display: grid; gap: 10px; }
h1 { font: 700 clamp(28px, 5vw, 44px)/1.05 var(--display); letter-spacing: 0.02em; margin: 0; text-transform: uppercase; text-wrap: balance; }
.lede { color: var(--dim); max-width: 64ch; margin: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button { font: 600 13px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
  border-radius: 4px; padding: 10px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
button:focus-visible { outline: 2px solid var(--new); outline-offset: 2px; }
button.new { border-color: var(--new); color: var(--new); }
button.old { color: var(--old); }
button.big { padding: 13px 18px; font-size: 14px; }
button.big.new { background: var(--new); color: var(--bg); }
button:active { transform: translateY(1px); }
.hint { font: 12px/1.4 var(--mono); color: var(--dim); }
section { display: grid; gap: 10px; }
h2 { font: 700 13px/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); margin: 0; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.strips { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.strip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.strip .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 8px; }
.strip b { font: 700 16px/1.1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; }
.strip .meta { font: 11px/1 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.strip p { margin: 0; color: var(--dim); font-size: 13px; line-height: 1.4; min-height: 2.8em; }
.strip canvas { width: 100%; height: 44px; display: block; }
.strip .btns { display: flex; gap: 8px; }
.strip .btns button { flex: 1; }
.strip.on { border-color: var(--live); }
.deck { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 12px; }
.deck .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.deck .lbl { font: 600 12px/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); width: 84px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button[aria-pressed="true"] { border-color: var(--new); color: var(--new); }
.readout { font: 13px/1.5 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; min-height: 3em; }
footer { font-size: 13px; color: var(--dim); max-width: 70ch; }
@media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
